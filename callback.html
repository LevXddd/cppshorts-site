<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authorized &mdash; CppShorts Autoposter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #131A2E;
    --bg-raised: #1B2440;
    --line: rgba(255,255,255,0.09);
    --text: #ECEFF4;
    --text-muted: #9AA3B8;
    --accent: #F2A33D;
    --bad: #E2604F;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.6;
    padding: 6vh 6vw 10vh;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }
  a.back{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--accent);
    text-decoration: none;
    display: inline-block;
    margin-bottom: 2rem;
  }
  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    margin: 0 0 0.6rem;
  }
  p{ color: var(--text-muted); margin: 0 0 1.5rem; max-width: 36em; }
  .code-box{
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .code-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }
  .code-value{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.95rem;
    color: var(--accent);
    word-break: break-all;
    user-select: all;
  }
  button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1rem;
    cursor: pointer;
    margin-top: 1rem;
  }
  button:active{ opacity: 0.85; }
  .hint{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .error{ color: var(--bad); }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">&larr; CppShorts Autoposter</a>
    <div id="content">
      <p>Reading the redirect from TikTok&hellip;</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const errorDesc = params.get('error_description');
    const el = document.getElementById('content');

    if (code) {
      el.innerHTML = `
        <h1>Authorized</h1>
        <p>Copy this code into your script now &mdash; TikTok's authorization
        codes expire within minutes.</p>
        <div class="code-box">
          <div class="code-label">authorization code</div>
          <div class="code-value" id="codeVal">${code}</div>
        </div>
        <button id="copyBtn">Copy code</button>
        <p class="hint" style="margin-top:1.5rem">This page never sends the
        code anywhere &mdash; it only reads it from the URL bar, locally in
        your browser.</p>
      `;
      document.getElementById('copyBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(code);
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = 'Copy code'; }, 1500);
      });
    } else if (error) {
      el.innerHTML = `
        <h1 class="error">Authorization failed</h1>
        <p><strong style="color:var(--text)">${error}</strong></p>
        <p>${errorDesc ? errorDesc : 'TikTok did not return an authorization code.'}</p>
      `;
    } else {
      el.innerHTML = `
        <h1>Nothing here yet</h1>
        <p>This page is only meant to be reached automatically after
        signing in with TikTok &mdash; there's no code in the URL right now.</p>
      `;
    }
  </script>
</body>
</html>
